name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: API end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop_ci_only
          POSTGRES_DB: shop
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shop" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      # Throwaway CI-only values for the service containers above; not secrets.
      NODE_ENV: test
      # Three roles, as on AWS: the container superuser only bootstraps; the owner
      # (not a superuser) runs migrations; the API uses a restricted role.
      BOOTSTRAP_DATABASE_URL: postgres://shop:shop_ci_only@localhost:5432/shop
      MIGRATION_DATABASE_URL: postgres://shop_owner:shop_owner_ci_only@localhost:5432/shop
      DATABASE_URL: postgres://shop_app:shop_app_ci_only@localhost:5432/shop
      REDIS_URL: redis://localhost:6379
      LOG_LEVEL: error
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:bootstrap
      - run: pnpm db:migrate
      - run: pnpm db:setup-app-role
      - run: pnpm test:e2e
      # Migrations must match the schema: fails if someone edited schema.ts
      # without generating a migration. stdin is closed and a timeout set, so an
      # interactive rename prompt fails the job instead of hanging or passing.
      - run: timeout 120 pnpm --filter api exec drizzle-kit check < /dev/null
      - run: |
          set -euo pipefail
          timeout 120 pnpm --filter api exec drizzle-kit generate --name ci_drift_check < /dev/null
          if [ -n "$(git status --porcelain apps/api/drizzle)" ]; then
            echo "src/db/schema.ts has changes with no migration. Run pnpm db:generate."
            git status --porcelain apps/api/drizzle
            exit 1
          fi
